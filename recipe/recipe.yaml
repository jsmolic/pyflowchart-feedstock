schema_version: 1

context:
  name: pyflowchart
  version: "0.3.1"

package:
  name: pyflowchart
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/pyflowchart/pyflowchart/pyflowchart-${{ version }}.tar.gz
  sha256: 4268699c4d11d1ab4e5276a12441f7eea6468ee3d87fadb54a4d2449cc3526c1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - astunparse
    - chardet

tests:
  - python:
      imports:
        - pyflowchart
      pip_check: true
      python_version:
      - ${{ python_min }}.*
      - '*'

about:
  summary: Python codes to Flowcharts.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/cdfmlr/pyflowchart

extra:
  recipe-maintainers:
    - julian-belina
