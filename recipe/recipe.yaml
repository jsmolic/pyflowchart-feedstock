schema_version: 1

context:
  version: 0.6.0

package:
  name: pyflowchart
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/p/pyflowchart/pyflowchart-${{ version }}.tar.gz
  sha256: 4c80bdc62389600e63d558dc27d694bffd3b82e87bacbb793ed2e4423e93f2b9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
    - pyflowchart = pyflowchart.__main__:cli

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - astunparse
    - chardet

tests:
  - python:
      imports:
        - pyflowchart
      pip_check: true
      python_version:
      - ${{ python_min }}.*
      - '*'

about:
  summary: Python codes to Flowcharts.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/cdfmlr/pyflowchart

extra:
  recipe-maintainers:
    - julian-belina
    - jsmolic
